services:
  postgres:
    image: postgres:16-alpine
    container_name: homequeen-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homequeen
    volumes:
      - homequeen_pg:/var/lib/postgresql/data

volumes:
  homequeen_pg:
